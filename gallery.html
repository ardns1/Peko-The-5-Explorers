<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journey Gallery - Peko & The 5 Explorers</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .main-preview {
      background-color: #121e19;
      border-radius: 12px;
      min-height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #1a2c25;
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .main-preview:hover {
      transform: scale(1.01);
      border-color: #d4af37;
    }

    .main-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumbnail-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 15px;
    }

    .thumb-item {
      background-color: #121e19;
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
      border: 2px solid transparent;
      transition: all 0.3s ease;
      height: 160px;
    }

    .thumb-item:hover {
      border-color: #d4af37;
      transform: translateY(-3px);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* POP-UP MODAL ZOOM GALERI */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(18, 30, 25, 0.95);
      border: 1px solid #d4af37;
      border-radius: 20px;
      width: 100%;
      max-width: 700px;
      padding: 20px;
      text-align: center;
      position: relative;
      transform: scale(0.7);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 18px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .close-btn:hover {
      background: #d4af37;
      color: #0b130e;
    }

    .modal-img-box {
      width: 100%;
      max-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 12px;
    }

    .modal-img-box img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 12px;
    }

    @media (max-width: 768px) {
      .gallery-layout {
        grid-template-columns: 1fr;
      }
      .thumb-item {
        height: 100px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER NAVBAR -->
  <header>
    <nav>
      <div class="logo">PEKO & THE 5 EXPLORERS</div>
      <ul class="nav-links">
        <li><a href="cover.html">HOME</a></li>
        <li><a href="about.html">ABOUT FILM</a></li>
        <li><a href="ost.html">SOUNDTRACK</a></li>
        <li><a href="character.html">CHARACTERS</a></li>
        <li><a href="gallery.html" class="active">GALLERY</a></li>
      </ul>
      <div class="search-icon">🔍</div>
    </nav>
  </header>

  <!-- KONTEN GALERI -->
  <div class="container">
    <h1 class="page-title">JOURNEY GALLERY</h1>
    <p class="page-subtitle">Klik gambar untuk memperbesar preview</p>

    <div class="gallery-layout">
      <!-- Image Preview Utama (Kiri) -->
      <div class="main-preview">
        <img id="main-gallery-img" src="img/" alt="Preview Galeri Utama">
      </div>

      <!-- Grid 6 Thumbnail (Kanan) -->
      <div class="thumbnail-grid">
        <div class="thumb-item"><img src="img/g1.jpeg" alt="Lembah Misterius"></div>
        <div class="thumb-item"><img src="img/g2.jpeg" alt="Lembah Misterius"></div>
        <div class="thumb-item"><img src="img/g3.jpeg" alt="Kerajaan Bauwanko"></div>
        <div class="thumb-item"><img src="img/g4.jpeg" alt="Perjuangan Nobita & Peko"></div>
        <div class="thumb-item"><img src="img/g5.jpeg" alt="Kebersamaan Lima Penjelajah"></div>
        <div class="thumb-item"><img src="img/g6.jpeg" alt="Puncak Petualangan"></div>
      </div>
    </div>
  </div>

  <!-- POP-UP MODAL ZOOM -->
  <div class="modal-overlay" id="gallery-modal">
    <div class="modal-card">
      <button class="close-btn" id="close-modal">✕</button>
      <div class="modal-img-box">
        <img id="modal-img" src="" alt="Gallery Preview Zoom">
      </div>
    </div>
  </div>

  <script>
    const mainImg = document.getElementById('main-gallery-img');
    const mainPreviewBox = document.querySelector('.main-preview');
    const thumbItems = document.querySelectorAll('.thumb-item img');

    const modalOverlay = document.getElementById('gallery-modal');
    const closeModalBtn = document.getElementById('close-modal');
    const modalImg = document.getElementById('modal-img');

    // Saat thumbnail diklik -> Ganti gambar kiri DAN Buka Pop-up Zoom
    thumbItems.forEach((thumb) => {
      thumb.parentElement.addEventListener('click', () => {
        const src = thumb.getAttribute('src');
        const alt = thumb.getAttribute('alt');

        // Ganti preview sebelah kiri
        mainImg.src = src;
        mainImg.alt = alt;

        // Tampilkan di Pop-Up Modal Zoom
        modalImg.src = src;
        modalOverlay.classList.add('active');
      });
    });

    // Saat gambar utama kiri diklik -> Buka Pop-up Zoom juga
    mainPreviewBox.addEventListener('click', () => {
      modalImg.src = mainImg.src;
      modalOverlay.classList.add('active');
    });

    // Tutup Modal via tombol X
    closeModalBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    // Tutup Modal saat klik area luar gambar
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
      }
    });

    // Tutup Modal saat tombol Esc ditekan
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        modalOverlay.classList.remove('active');
      }
    });
  </script>

</body>
</html>
